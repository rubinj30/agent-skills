<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1321">
    <title>{{TITLE}}</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0d1321; color: #f4f7fb; font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: max(42px, env(safe-area-inset-top)) 22px max(42px, env(safe-area-inset-bottom)); }
      h1 { margin: 0 0 12px; font-size: clamp(30px, 8vw, 44px); line-height: 1.08; letter-spacing: -0.025em; }
      p { color: #c7d0df; }
      audio { display: block; width: 100%; min-height: 54px; margin: 30px 0 20px; }
      a { color: #8cc8ff; }
      .button { display: inline-block; min-height: 48px; padding: 11px 16px; border: 1px solid #4b6382; border-radius: 12px; text-decoration: none; }
      .meta { font-size: 14px; color: #9eabc0; }
      details { margin-top: 34px; border-top: 1px solid #28364d; padding-top: 20px; }
      summary { cursor: pointer; font-weight: 700; min-height: 44px; }
      .transcript p { margin: 18px 0; color: #d9e0ea; }
      .transcript strong { display: block; color: #8cc8ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{TITLE}}</h1>
      <p>{{DESCRIPTION}}</p>
      <audio controls preload="metadata">
        <source src="{{AUDIO_FILE}}" type="{{AUDIO_TYPE}}">
        Your browser does not support this audio player.
      </audio>
      <p><a class="button" href="{{AUDIO_FILE}}" download>Download audio</a></p>
      <p class="meta">{{DURATION}} · Two AI-generated voices · {{SOURCE_NOTE}}</p>
      <details>
        <summary>Read transcript</summary>
        <div class="transcript">{{TRANSCRIPT}}</div>
      </details>
    </main>
  </body>
</html>
